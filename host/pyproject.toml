[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ses-host"
version = "0.1.0"
description = "A private, general-purpose event archive and notification host"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "pillow>=12.1.1,<14",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
ses = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
