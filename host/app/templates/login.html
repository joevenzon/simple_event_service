<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Simple Event Service</title>
<main>
  <h1>Simple Event Service</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Username <input name="username" autocomplete="username" maxlength="100" required></label></p>
    <p><label>Password <input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label></p>
    <button type="submit">Sign in</button>
  </form>
</main>
</html>
