[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ses-frigate-monitor"
version = "0.1.0"
description = "An independent Frigate MQTT producer for Simple Event Service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "paho-mqtt>=2.1,<3",
    "pillow>=12.1.1,<14",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
ses-frigate-monitor = "frigate_monitor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["frigate_monitor"]
